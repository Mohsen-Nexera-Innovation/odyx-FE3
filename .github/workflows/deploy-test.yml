name: Deploy Test VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-test-vps-web
  cancel-in-progress: true

jobs:
  deploy:
    # Runs on the VPS itself (outbound to GitHub). No inbound SSH required.
    runs-on: [self-hosted, odyx-vps]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy web on this VPS
        run: |
          set -euo pipefail
          cd /opt/odyx/api
          chmod +x deploy/vps-deploy.sh
          ./deploy/vps-deploy.sh web
          echo "Deployed WEB commit: $(git -C /opt/odyx/web log -1 --oneline)"
