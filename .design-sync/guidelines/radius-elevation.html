<!-- @dsCard group="Layout" viewport="760x280" name="Radius & elevation" subtitle="Radii climb with surface size; shadows are blue-tinted, never neutral grey" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:18px;background:#fff;font-family:var(--font-body);color:var(--hv2-ink)}
.t{font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--hv2-mut);font-weight:700;margin:0 0 10px}
.row{display:flex;gap:10px;align-items:flex-end;margin-bottom:18px}
.r{flex:1;background:#F3F5FD;border:1px solid var(--hv2-line);height:66px;display:flex;align-items:flex-end;padding:8px}
.r span{font-size:.62rem;color:var(--hv2-mut)}
.el{display:flex;gap:16px}
.card{flex:1;background:#fff;border-radius:var(--r-card);padding:12px;font-size:.7rem;color:var(--hv2-body)}
.c1{box-shadow:0 16px 44px rgba(10,40,90,.09)}
.c2{box-shadow:0 18px 44px rgba(8,80,130,.10)}
.c3{background:#0A1745;color:#fff;box-shadow:0 24px 60px rgba(0,0,0,.5)}
</style></head><body>
<p class="t">Radius</p>
<div class="row">
  <div class="r" style="border-radius:10px"><span>btn 10</span></div>
  <div class="r" style="border-radius:13px"><span>chip 13</span></div>
  <div class="r" style="border-radius:18px"><span>card 18</span></div>
  <div class="r" style="border-radius:24px"><span>panel 24</span></div>
  <div class="r" style="border-radius:26px"><span>band 26</span></div>
  <div class="r" style="border-radius:30px"><span>pill 30</span></div>
</div>
<p class="t">Elevation</p>
<div class="el">
  <div class="card c1"><b>Card</b><br><code>--hv2-card-shadow</code></div>
  <div class="card c2"><b>Raised</b><br><code>--shadow-card-light</code></div>
  <div class="card c3"><b>Cinematic</b><br><code>--shadow-card-dark</code></div>
</div>
</body></html>
